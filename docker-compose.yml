services:
  stonesync-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stonesync-web
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/go')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stonesync.rule=Host(`${DOMAIN:-stonesync.exit-code.net}`)"
      - "traefik.http.routers.stonesync.entrypoints=websecure"
      - "traefik.http.routers.stonesync.tls=true"
      - "traefik.http.routers.stonesync.tls.certresolver=httpresolver"
      - "traefik.http.services.stonesync.loadbalancer.server.port=8080"
    networks:
      - web_network

networks:
  web_network:
    name: web_network
    external: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Black Stone Gradient -->
    <radialGradient id="blackStoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="40%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- White Stone Gradient -->
    <radialGradient id="whiteStoneGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="85%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Lines (Go Motif) -->
  <g stroke="#374151" stroke-width="1" opacity="0.4">
    <line x1="40" y1="40" x2="260" y2="40" />
    <line x1="40" y1="80" x2="260" y2="80" />
    <line x1="40" y1="120" x2="260" y2="120" />
    <line x1="40" y1="160" x2="260" y2="160" />

    <line x1="60" y1="20" x2="60" y2="180" />
    <line x1="110" y1="20" x2="110" y2="180" />
    <line x1="160" y1="20" x2="160" y2="180" />
    <line x1="210" y1="20" x2="210" y2="180" />
  </g>

  <!-- Star Point (Hoshi) -->
  <circle cx="160" cy="100" r="4" fill="#6B7280" />

  <!-- Connection Wave Arc -->
  <path d="M 90,100 A 70,70 0 0,1 230,100" fill="none" stroke="url(#goldGlow)" stroke-width="3" stroke-dasharray="6,4" opacity="0.8" filter="url(#glow)" />

  <!-- Black Stone -->
  <circle cx="100" cy="100" r="32" fill="url(#blackStoneGrad)" filter="url(#dropShadow)" />
  <ellipse cx="90" cy="90" rx="10" ry="6" fill="#FFFFFF" opacity="0.15" />

  <!-- White Stone -->
  <circle cx="220" cy="100" r="32" fill="url(#whiteStoneGrad)" filter="url(#dropShadow)" />
  <ellipse cx="212" cy="90" rx="12" ry="7" fill="#FFFFFF" opacity="0.8" />

  <!-- Brand Typography -->
  <text x="310" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="3" fill="#F9FAFB">
    STONE<tspan fill="#F59E0B">SYNC</tspan>
  </text>
  
  <text x="312" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#9CA3AF">
    REAL-TIME MULTIPLAYER GO ENGINE
  </text>

  <!-- Status / Mode Badges -->
  <g transform="translate(312, 145)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#1E293B" stroke="#374151" />
    <circle cx="12" cy="11" r="4" fill="#10B981" />
    <text x="24" y="15" font-family="sans-serif" font-size="10" font-weight="700" fill="#D1D5DB">ONLINE</text>
  </g>

  <g transform="translate(402, 145)">
    <rect x="0" y="0" width="105" height="22" rx="11" fill="#1E293B" stroke="#374151" />
    <text x="12" y="15" font-family="sans-serif" font-size="10" font-weight="700" fill="#9CA3AF">9x9 · 13x13 · 19x19</text>
  </g>

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="800" height="4" fill="url(#goldGlow)" rx="2" />
</svg>
